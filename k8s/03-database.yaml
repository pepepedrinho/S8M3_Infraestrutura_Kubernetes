apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zadinventory-db-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zadinventory-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zadinventory-db
  template:
    metadata:
      labels:
        app: zadinventory-db
    spec:
      containers:
      - name: db
        image: mysql:8.4
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          valueFrom: { configMapKeyRef: { name: zadinventory-config, key: DB_NAME } }
        - name: MYSQL_USER
          valueFrom: { secretKeyRef: { name: zadinventory-secret, key: DB_USER } }
        - name: MYSQL_PASSWORD
          valueFrom: { secretKeyRef: { name: zadinventory-secret, key: DB_PASSWORD } }
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: zadinventory-secret, key: DB_PASSWORD } }
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zadinventory-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zadinventory-db
spec:
  selector:
    app: zadinventory-db
  ports:
  - port: 3306
    targetPort: 3306