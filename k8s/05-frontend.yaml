apiVersion: apps/v1
kind: Deployment
metadata:
  name: zadinventory-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zadinventory-frontend
  template:
    metadata:
      labels:
        app: zadinventory-frontend
    spec:
      containers:
      - name: frontend
        image: zadinventory-frontend:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 32Mi
            cpu: 25m
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zadinventory-frontend
spec:
  type: NodePort
  selector:
    app: zadinventory-frontend
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080