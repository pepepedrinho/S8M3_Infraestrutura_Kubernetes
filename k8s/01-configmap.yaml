apiVersion: v1
kind: ConfigMap
metadata:
  name: zadinventory-config
data:
  DB_NAME: "zadinventory"
  SPRING_DATASOURCE_URL: "jdbc:mysql://zadinventory-db:3306/zadinventory"
  SPRING_CLOUD_GCP_SQL_ENABLED: "false"
  SPRING_CLOUD_GCP_CORE_ENABLED: "false"
  INSTANCE_CONNECTION_NAME: "local:local:local"
  JWT_EXPIRATION: "86400000"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"