# Desliga o Google Cloud SQL nos testes. Sem isso o starter do GCP
# sobrescreve a URL abaixo por "jdbc:mysql://google/${DB_NAME}?..." e o
# driver do H2 rejeita a conexao ("Driver org.h2.Driver claims to not accept jdbcUrl").
spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.core.enabled=false

# Configuracoes do H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=false

# Configuracoes gerais
spring.main.allow-bean-definition-overriding=true
spring.jpa.defer-datasource-initialization=false

# JWT apenas para testes (valor fixo, nao usado fora daqui)
jwt.secret=emFkaW52ZW50b3J5LWNoYXZlLWRlLXRlc3RlLXNvbWVudGUtcGFyYS11bml0LXRlc3RzLTAxMjM0NTY3ODk=
jwt.expiration=86400000

# Configuracoes para resolver problemas de serializacao (iguais ao production)
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Otimizacoes de desempenho para carregamento de relacionamentos
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Configuracao avancada de serializacao
spring.jackson.serialization.write-single-elem-arrays-unwrapped=false
spring.jackson.deserialization.READ_UNKNOWN_ENUM_VALUES_USING_DEFAULT_VALUE=true

# Logging reduzido para testes
logging.level.org.springframework=WARN
logging.level.app.zad.zadinventory=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
