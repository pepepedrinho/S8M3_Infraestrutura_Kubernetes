spring.application.name=zadinventory

# Configuracao automatica do Google Cloud SQL (usada em producao / Cloud Run).
# Para rodar na sua maquina use o perfil "local": --spring.profiles.active=local
spring.cloud.gcp.sql.instance-connection-name=${INSTANCE_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME}

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracoes para resolver problemas de serializacao
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Otimizacoes de desempenho para carregamento de relacionamentos
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Configuracao avancada de serializacao
spring.jackson.serialization.write-single-elem-arrays-unwrapped=false
spring.jackson.deserialization.READ_UNKNOWN_ENUM_VALUES_USING_DEFAULT_VALUE=true

# Configuracoes do JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator: expoe SOMENTE o health, que o workflow usa para validar o deploy no
# Cloud Run. Os demais endpoints (env, beans, mappings) continuam desligados
# para nao vazar configuracao. O health agrega o indicador do banco, entao um
# 200 aqui prova que a aplicacao subiu E alcanca o Cloud SQL.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
