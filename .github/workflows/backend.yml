name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: zadinventory-backend/zadinventory
        run: mvn -B verify

      - name: Vulnerabilidades das dependencias (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: zadinventory-backend/zadinventory
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE: zadinventory-backend:ci
      NETWORK: zadinventory-ci
      DB_NAME: zadinventory
      DB_USER: zaduser
      DB_PASSWORD: zadpass123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE" ./zadinventory-backend

      - name: Subir o MySQL
        run: |
          set -euo pipefail

          docker network create "$NETWORK"

          docker run -d --name zadinventory-db --network "$NETWORK" \
            -e MYSQL_DATABASE="$DB_NAME" \
            -e MYSQL_USER="$DB_USER" \
            -e MYSQL_PASSWORD="$DB_PASSWORD" \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" \
            mysql:8.4

          # -h 127.0.0.1 forca TCP: durante a inicializacao o MySQL so atende
          # por socket, entao o ping so passa quando o servidor final subiu.
          for TENTATIVA in $(seq 1 40); do
            if docker exec zadinventory-db mysqladmin ping -h 127.0.0.1 \
                -uroot -p"$DB_PASSWORD" --silent 2>/dev/null; then
              echo "MySQL pronto (tentativa ${TENTATIVA})."
              exit 0
            fi
            sleep 3
          done

          echo "O MySQL nao ficou pronto a tempo."
          exit 1

      - name: Subir o backend e validar (smoke test)
        run: |
          set -euo pipefail

          docker run -d --name backend --network "$NETWORK" -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://zadinventory-db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false" \
            -e SPRING_CLOUD_GCP_SQL_ENABLED=false \
            -e SPRING_CLOUD_GCP_CORE_ENABLED=false \
            -e INSTANCE_CONNECTION_NAME=local:local:local \
            -e DB_NAME="$DB_NAME" \
            -e DB_USER="$DB_USER" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e JWT_SECRET=chave-jwt-de-teste-do-ci-com-mais-de-64-caracteres-0123456789-abcdef \
            -e JWT_EXPIRATION=86400000 \
            "$IMAGE"

          # As tentativas cobrem a subida do Spring Boot.
          for TENTATIVA in $(seq 1 40); do
            CODIGO=$(curl -s -o corpo.txt -w '%{http_code}' \
              http://localhost:8080/actuator/health || echo "000")
            echo "tentativa ${TENTATIVA}: HTTP ${CODIGO}"

            if [ "$CODIGO" = "200" ] && grep -q '"status":"UP"' corpo.txt; then
              echo "Resposta: $(cat corpo.txt)"
              echo "Backend validado: iniciou e conectou ao banco."
              exit 0
            fi

            sleep 5
          done

          echo "O backend nao respondeu UP em /actuator/health."
          echo "Ultima resposta: $(cat corpo.txt 2>/dev/null || echo '(vazia)')"
          exit 1

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: |
          echo "===== backend ====="
          docker logs backend || true
          echo "===== mysql ====="
          docker logs zadinventory-db || true