name: Frontend CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zadinventory-frontend/zadinventory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zadinventory-frontend/zadinventory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Build Angular application
        run: npm run build

      - name: Vulnerabilidades das dependencias (npm audit)
        run: npm audit --omit=dev --audit-level=critical

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test

    env:
      IMAGE: zadinventory-frontend:ci
      RESOLVER_HOST: kube-dns.kube-system.svc.cluster.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE" ./zadinventory-frontend

      - name: Validar a configuracao do Nginx
        run: |
          docker run --rm \
            --add-host "$RESOLVER_HOST:127.0.0.1" \
            "$IMAGE" nginx -t

      - name: Subir o container e validar (smoke test)
        run: |
          set -euo pipefail

          docker run -d --name frontend -p 8080:8080 \
            --add-host "$RESOLVER_HOST:127.0.0.1" \
            "$IMAGE"

          CODIGO="000"
          for TENTATIVA in $(seq 1 15); do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo "000")
            echo "tentativa ${TENTATIVA}: HTTP ${CODIGO}"
            if [ "$CODIGO" = "200" ]; then
              break
            fi
            sleep 2
          done

          if [ "$CODIGO" != "200" ]; then
            echo "O frontend nao respondeu 200 na pagina inicial."
            exit 1
          fi

          # Rotas do Angular nao existem como arquivo: o Nginx deve devolver o
          # index.html (try_files), e nao 404.
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/rota-do-angular)
          echo "rota do Angular: HTTP ${CODIGO}"
          if [ "$CODIGO" != "200" ]; then
            echo "O fallback para o index.html nao esta funcionando."
            exit 1
          fi

          # O header X-Served-By e o que a demonstracao de balanceamento usa
          # para mostrar qual Pod respondeu.
          curl -sI http://localhost:8080/ | grep -i '^x-served-by:' \
            || { echo "Header X-Served-By ausente."; exit 1; }

          echo "Frontend validado: pagina, rota do Angular e headers OK."

      - name: Logs do container (em caso de falha)
        if: failure()
        run: docker logs frontend || true